name: Airbnb Monitor - Orlando 2027

on:
  schedule:
    # Roda 2x por dia: 8h e 20h horario de Brasilia (11h e 23h UTC)
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  airbnb-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependencias
        run: |
          pip install selenium==4.16.0

      - name: Rodar Airbnb Monitor
        run: python airbnb_monitor.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit e push dos dados
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airbnb_historico.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: airbnb data $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" && git push)
