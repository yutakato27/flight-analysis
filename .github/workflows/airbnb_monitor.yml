name: Airbnb Monitor - Orlando 2027

on:
  schedule:
    # Roda a cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  airbnb-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser

      - name: Instalar dependencias
        run: |
          pip install selenium==4.16.0

      - name: Rodar Airbnb Monitor
        run: python airbnb_monitor.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit e push dos dados
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airbnb_historico.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: airbnb data $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" && git push)
